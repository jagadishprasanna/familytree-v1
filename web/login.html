<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Family Tree</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f0e8;color:#22302a;
       font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background-image:radial-gradient(circle at 1px 1px,#d9d4c7 1px,transparent 0);background-size:24px 24px}
  .box{width:min(380px,92vw);background:#fff;border-radius:14px;padding:30px 28px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
  h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:9px;color:#2e6a4e}
  p{margin:0 0 18px;color:#6c7a72}
  label{display:block;font-size:12px;color:#6c7a72;margin:12px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid #cfd8d3;border-radius:8px;font:inherit}
  input:focus{outline:2px solid #2e6a4e55;border-color:#2e6a4e}
  button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:8px;background:#2e6a4e;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #err{margin-top:14px;color:#8b2e2e;min-height:1.2em;font-size:14px}
</style>
</head>
<body>
  <form class="box" id="f" autocomplete="on">
    <h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2e6a4e" stroke-width="2" stroke-linecap="round"><path d="M12 21V9M12 13c-4 0-6-2-6-6 4 0 6 2 6 6zM12 15c3 0 5-2 5-5-3 0-5 2-5 5z"/></svg>Family Tree</h1>
    <p>Sign in to view the family tree.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
      const j = await r.json();
      if (r.ok) { location.replace('/' + location.hash); return; }
      err.textContent = j.error || 'Sign-in failed';
    } catch (x) { err.textContent = 'Could not reach the server.'; }
    go.disabled = false;
  });
</script>
</body>
</html>
