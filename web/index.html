<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Tree</title>
<style>
  :root{--bg:#f3f0e8;--ink:#22302a;--muted:#6c7a72;--green:#2e6a4e;--green2:#245640;
        --m:#5a8fbf;--f:#c97a8f;--o:#8f9a94;--line:#9fb0a6;--card:#fff;--sel:#f2b134}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;-webkit-text-size-adjust:100%;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;min-height:56px;background:var(--green);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
  header input,header select,header button{height:34px;border-radius:6px;border:0;padding:0 10px;font:inherit}
  header input{width:260px}
  header button,header select{background:#fff;color:var(--ink);cursor:pointer}
  .seg{display:flex;border-radius:6px;overflow:hidden}
  .seg button{border-radius:0;background:#3f8062;color:#fff}
  .seg button.on{background:#fff;color:var(--green2);font-weight:600}
  .grow{flex:1}
  .treectl{} body.cap .treectl,body.ask .treectl{display:none!important} body.cap main,body.ask main{display:none} body:not(.cap) #capsule{display:none} body:not(.ask) #chat{display:none}
  #capsule{flex:1;min-height:0;display:flex;flex-direction:column;background:#17201b;color:#fff}
  #cap-actions{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:#101713;border-bottom:1px solid #26332b}
  #cap-actions[hidden],#cap-dialog[hidden]{display:none} #cap-actions .btn[hidden]{display:none}
  #cap-status{color:#cfd8d3;font-size:13px}
  #cap-dialog{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
  .cap-box{background:#fff;color:#22302a;border-radius:12px;padding:18px;width:min(400px,100%);display:grid;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .cap-box h3{margin:0 0 2px;font-size:17px} .cap-box p{margin:0;color:#4a5a52;line-height:1.5}
  .cap-box label{font-size:12px;color:#6c7a72;margin-top:4px}
  .cap-box input{width:100%;padding:9px 10px;border:1px solid #cfd8d3;border-radius:6px;font:inherit;font-size:16px}
  .cap-box .row{margin-top:8px}
  .cap-msg{margin:auto;max-width:560px;padding:24px;text-align:center;color:#cfd8d3;line-height:1.6}
  .cap-msg code{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:4px}
  #cap-wrap{flex:1;min-height:0;display:flex;flex-direction:column} #cap-wrap[hidden]{display:none}
  #cap-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;outline:0;background:#000}
  #cap-img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .25s}
  #cap-img.fade{opacity:0}
  .cap-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:70px;border:0;border-radius:8px;
    background:rgba(0,0,0,.4);color:#fff;font-size:38px;cursor:pointer;line-height:1}
  .cap-nav:hover{background:rgba(0,0,0,.65)} .cap-nav.prev{left:12px} .cap-nav.next{right:12px}
  .cap-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
    padding:36px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
  .cap-info{min-width:0;flex:1} #cap-about{font-size:14px;line-height:1.45;color:#e6ece8;margin-top:4px;max-width:640px;max-height:5.8em;overflow:auto} #cap-about:empty,#cap-people:empty{display:none}
  #cap-people{margin-top:6px} #cap-people button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;min-height:28px;padding:2px 10px} #cap-people button:hover{background:rgba(255,255,255,.26)}
  .cap-box textarea{width:100%;padding:9px 10px;border:1px solid #cfd8d3;border-radius:6px;font:inherit;font-size:16px;resize:vertical}
  .cap-box .cchips{margin-top:2px} .cap-box .cchips button{font-size:13px} .cap-box .cchips .x{margin-left:6px;opacity:.6}
  #cap-title{font-size:17px;font-weight:600} #cap-date{font-size:13px;color:#cfd8d3}
  .cap-tools{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13px}
  .cap-tools button{border:0;border-radius:6px;padding:6px 10px;background:rgba(255,255,255,.18);color:#fff;font:inherit;cursor:pointer}
  .cap-tools button:hover{background:rgba(255,255,255,.3)}
  #cap-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#101713}
  #cap-strip img{height:64px;width:auto;min-width:48px;border-radius:4px;opacity:.55;cursor:pointer;flex:none;border:2px solid transparent;background:#222}
  #cap-strip img.on{opacity:1;border-color:var(--sel)} #cap-strip img:hover{opacity:.9}
  #cap-strip .dot{width:10px;height:10px;border-radius:50%;background:#56645c;flex:none;cursor:pointer;margin:auto 2px}
  #cap-strip .dot.on{background:var(--sel)}
  main{flex:1;min-height:0;display:flex;position:relative}
  #svg{flex:1;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:
      radial-gradient(circle at 1px 1px,#d9d4c7 1px,transparent 0) 0 0/24px 24px}
  #svg:active{cursor:grabbing}
  .edge{fill:none;stroke:var(--line);stroke-width:2}
  .marry{stroke:#c9a24a;stroke-width:3}
  .card rect:first-child{fill:var(--card);stroke:#d6dcd8;stroke-width:1.5;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12))}
  .card{cursor:pointer}
  .card:hover rect:first-child{stroke:var(--green)}
  .card.M .bar{fill:var(--m)} .card.F .bar{fill:var(--f)} .card.O .bar{fill:var(--o)}
  .card .av{fill:#e9eeeb} .card .sil{fill:#aebab3} .card .ring{fill:none;stroke:#d3dbd6;stroke-width:1.5}
  .hdr{display:flex;gap:14px;align-items:center;margin-bottom:8px}
  .pic{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#e9eeeb;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.28);flex:none;display:block}
  .pic.M{box-shadow:0 0 0 3px var(--m)} .pic.F{box-shadow:0 0 0 3px var(--f)}
  .pic svg{width:100%;height:100%} .pic.empty{cursor:pointer}
  .attrs{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;padding:9px 12px;background:#f7f9f8;border:1px solid #e1e8e4;border-radius:8px}
  .attrs dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;align-self:center} .attrs dd{margin:0;font-weight:600}
  .hdr h2{margin:0} .hdr .sub{margin:2px 0 0}
  .card.M .av{fill:#e3eef8} .card.F .av{fill:#f8e6ec}
  .card.focus rect:first-child{stroke:var(--green);stroke-width:3}
  .card.sel rect:first-child{stroke:var(--sel);stroke-width:3.5}
  .nm{font-size:14px;font-weight:600;fill:var(--ink)} .yr{font-size:12px;fill:var(--muted)}
  .ph rect{fill:transparent;stroke:#b4c0b9;stroke-width:1.5;stroke-dasharray:6 5}
  .ph text{fill:var(--muted);font-size:13px} .ph{cursor:pointer} .ph:hover rect{stroke:var(--green)}
  aside{width:340px;background:#fff;border-left:1px solid #ddd;overflow:auto;padding:18px;display:none}
  aside.open{display:block}
  aside h2{margin:0 0 2px;font-size:20px}
  .sub{color:var(--muted);margin-bottom:10px}
  .rel{background:#eef5f1;border-radius:8px;padding:8px 10px;margin:10px 0;color:var(--green2)}
  aside h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  aside a{color:var(--green2);cursor:pointer;text-decoration:none;display:block;padding:3px 0}
  aside a:hover{text-decoration:underline} .none{color:#aab4ae}
  .btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
  .btn.ghost{background:#eef5f1;color:var(--green2)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .btn.danger{background:#fbeaea;color:#8b2e2e} .btn.danger.solid{background:#b03a3a;color:#fff}
  .warn{background:#fdf3f3;border:1px solid #efc9c9;border-radius:8px;padding:10px 12px;margin-top:10px;color:#6b2323}
  .warn p{margin:0 0 10px}
  form{background:#f7f9f8;border:1px solid #e1e8e4;border-radius:8px;padding:10px;margin-top:10px;display:grid;gap:7px}
  form input,form select,form textarea{width:100%;resize:vertical;padding:6px 8px;border:1px solid #cfd8d3;border-radius:6px;font:inherit}
  form label{font-size:12px;color:var(--muted)} .chk{display:flex;gap:6px;align-items:center}
  .chk input{width:auto}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#8b2e2e;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9}
  .hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.8);padding:4px 8px;border-radius:6px}
  #chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg,#f3f0e8)}
  #chat-log{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
  .cmsg{max-width:min(720px,92%);padding:10px 14px;border-radius:14px;line-height:1.5;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .cmsg p{margin:0 0 6px} .cmsg p:last-child{margin-bottom:0} .cmsg ul{margin:4px 0 6px;padding-left:20px}
  .cmsg.u{align-self:flex-end;background:#2e6a4e;color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
  .cmsg.a{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
  .cmsg.err{align-self:flex-start;background:#fbeaea;color:#6b2323}
  .cmsg.hello{align-self:center;max-width:620px;text-align:center;background:transparent;box-shadow:none;color:#4a5a52}
  .cmsg.hello h2{margin:0 0 6px;color:#2e6a4e} .cmsg.hello code{background:rgba(0,0,0,.07);padding:1px 6px;border-radius:4px}
  .cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cchips button{border:1px solid #cfe0d6;background:#eef5f1;color:#245640;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:30px}
  .cchips button:hover{background:#dcebe2} .cchips .lbl{font-size:12px;color:#6c7a72;align-self:center}
  #chat-sugg{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px;justify-content:center}
  #chat-sugg button{border:1px solid #cfd8d3;background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:#245640}
  #chat-sugg button:hover{background:#eef5f1}
  #chat-bar{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd}
  #chat-in{flex:1;resize:none;max-height:120px;padding:10px 12px;border:1px solid #cfd8d3;border-radius:10px;font:inherit;font-size:16px;line-height:1.4}
  #chat-in:focus{outline:2px solid #2e6a4e55;border-color:#2e6a4e}
  #chat-send{height:42px;padding:0 18px} #chat-send:disabled,#chat-in:disabled{opacity:.55;cursor:wait}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9bb3a6;animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .ctl{display:contents} #sheet{display:contents} #pclose{display:none}
  @media(hover:none),(max-width:800px){button,select,summary{min-height:38px} .btn{padding:9px 14px}}
  @media(max-width:800px){
    header{flex-wrap:wrap;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
    header h1{order:1} header h1 .brand{display:none} #tabs{order:2} .grow{order:3} #logout{order:4}
    #search{order:5;flex:1 1 100%;width:100%} header .hide-sm{display:none}
    header input,header select,header button{height:38px;font-size:16px}
    #tabs button{font-size:14px;padding:0 12px}
    .ctl{display:flex;position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
      gap:8px;padding:6px;border-radius:12px;background:rgba(36,86,64,.94);box-shadow:0 4px 16px rgba(0,0,0,.3)}
    .ctl{max-width:calc(100vw - 16px)} .ctl .seg button{font-size:13px;padding:0 9px} .ctl select{padding:0 4px;min-width:0}
    .hint b,.hint .sep{display:none}
    .hint{bottom:auto;top:8px;left:8px;right:8px;text-align:center;pointer-events:none;font-size:11px}
    #sheet{display:none}
    #sheet.open{display:flex;flex-direction:column;position:absolute;left:0;right:0;bottom:0;max-height:72%;z-index:7;background:#fff;
      border-radius:16px 16px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.28)}
    #pclose{display:block;flex:none;align-self:flex-end;margin:8px 10px 0;border:0;border-radius:8px;background:#eef5f1;color:var(--green2);
      font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
    #sheet aside{width:auto;flex:1;min-height:0;border:0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
    form input,form select,form textarea{font-size:16px;padding:9px 10px}
    #toast{bottom:auto;top:calc(124px + env(safe-area-inset-top));max-width:92vw;text-align:center}
    .pic{width:72px;height:72px}
    .cap-nav{width:36px;height:56px;font-size:30px} .cap-nav.prev{left:6px} .cap-nav.next{right:6px}
    .cap-bar{padding:28px 12px 10px} #cap-title{font-size:15px} .cap-tools{gap:6px} .cap-tools button{padding:6px 8px;min-height:34px}
    #cap-strip{padding:6px 8px calc(6px + env(safe-area-inset-bottom))} #cap-strip img{height:48px;min-width:36px}
  }
  @media(max-width:400px){#tabs button{padding:0 9px;font-size:13px} .m-hide{display:none}} @media(max-width:350px){#cap-count{display:none}}
</style>
</head>
<body>
<header>
  <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 21V9M12 13c-4 0-6-2-6-6 4 0 6 2 6 6zM12 15c3 0 5-2 5-5-3 0-5 2-5 5z"/></svg><span class="brand">Family Tree</span></h1>
  <div class="seg" id="tabs"><button id="t-tree" class="on"><span class="m-hide">Family </span>Tree</button><button id="t-cap"><span class="m-hide">Time </span>Capsule</button><button id="t-ask">Ask</button></div>
  <input id="search" class="treectl" list="plist" placeholder="Search a person…" autocomplete="off">
  <div class="ctl treectl">
    <div class="seg">
      <button id="v-ped" class="on">Ancestors</button>
      <button id="v-desc">Descendants</button>
    </div>
    <select id="depth" title="Generations"></select>
    <button id="fit">Fit</button>
  </div>
  <div class="grow"></div>
  <span class="hide-sm treectl" id="focusname"></span>
  <button id="logout" style="display:none">Sign out</button>
</header>
<main>
  <svg id="svg"><defs><clipPath id="avclip"><circle cx="36" cy="33" r="20"/></clipPath></defs><g id="vp"></g></svg>
  <div class="hint"><b id="src"></b><span class="sep"> · </span><span id="hinttxt"></span></div>
  <div id="sheet"><button id="pclose" aria-label="Close details">&times; Close</button><aside id="panel"></aside></div>
</main>
<section id="capsule">
  <div id="cap-actions" hidden>
    <button class="btn" id="cap-add">+ Add photos</button>
    <button class="btn" id="cap-note">Description &amp; people</button>
    <button class="btn ghost" id="cap-edit">Edit caption / date</button>
    <button class="btn danger" id="cap-del">Delete</button>
    <span id="cap-status"></span>
    <input type="file" id="cap-file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/*" multiple hidden>
  </div>
  <div id="cap-dialog" hidden></div>
  <div id="cap-msg" class="cap-msg"></div>
  <div id="cap-wrap" hidden>
    <div id="cap-stage" tabindex="0">
      <img id="cap-img" alt="">
      <button class="cap-nav prev" id="cap-prev" aria-label="Previous photo">&#8249;</button>
      <button class="cap-nav next" id="cap-next" aria-label="Next photo">&#8250;</button>
      <div class="cap-bar">
        <div class="cap-info"><div id="cap-title"></div><div id="cap-date"></div><div id="cap-about"></div><div id="cap-people" class="cchips"></div></div>
        <div class="cap-tools"><span id="cap-count"></span>
          <button id="cap-play" title="Slideshow (space)">&#9654; Play</button>
          <button id="cap-full" title="Full screen">&#9974;</button></div>
      </div>
    </div>
    <div id="cap-strip"></div>
  </div>
</section>
<section id="chat">
  <div id="chat-log"></div>
  <div id="chat-sugg"></div>
  <div id="chat-bar">
    <textarea id="chat-in" rows="1" maxlength="2000" placeholder="Ask about your family…" aria-label="Your question"></textarea>
    <button class="btn" id="chat-send">Send</button>
  </div>
</section>
<datalist id="plist"></datalist><datalist id="nakl"></datalist><datalist id="gotl"></datalist>
<input type="file" id="pfile" accept="image/*" hidden>
<div id="toast"></div>

<script>
const CW=190, CH=66, HG=28, VG=60, SG=20, VGAP=14, COLGAP=70;
let people=[], focus=null, selected=null, view='pedigree', depth=4, T={x:0,y:0,k:1};
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const svg=$('#svg'), vp=$('#vp');

function S(tag,attrs={},parent){const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;}
async function api(path,body){
  const r=await fetch(path, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  if(r.status===401){location.replace('/login'); throw new Error('Signed out');}
  const j=await r.json(); if(!r.ok) throw new Error(j.error||r.statusText); return j;}
function toast(m,ok,ms){const t=$('#toast');t.style.background=ok?'#2e6a4e':'';t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms||(m.length>90?9000:3500));}
const yr=s=>((s||'').match(/\d{4}/)||[''])[0];
function years(p){const b=yr(p.birth),d=yr(p.death); if(!b&&!d)return ''; return d?`${b||'?'} – ${d}`:b;}
const NAKSHATRAS=['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha',
  'Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha',
  'Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
const GOTRAS=['Atri','Bharadwaja','Gautama','Jamadagni','Kashyapa','Vasishtha','Vishvamitra','Agastya','Angirasa','Kaushika','Kaundinya','Srivatsa'];
const extraFields=(v={})=>`<label>Nakshatra</label><input name="nakshatra" list="nakl" value="${esc(v.nakshatra||'')}" placeholder="Birth star, e.g. Rohini" autocomplete="off">
    <label>Gotra</label><input name="gotra" list="gotl" value="${esc(v.gotra||'')}" placeholder="e.g. Bharadwaja" autocomplete="off">
    <label>Ailments</label><textarea name="ailments" rows="3" maxlength="1000" placeholder="Free text, e.g. diabetes, hypertension">${esc(v.ailments||'')}</textarea>`;
const photoUrl=p=>`/api/photo/${p.id}?v=${encodeURIComponent(p.photo)}`;
let MAXPHOTO=250000;
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const byId=id=>people.find(p=>p.id===id);

/* ---------- cards ---------- */
function card(g,p,x,y){
  const a=S('g',{class:`card ${p.gender||'O'} ${p.id===focus?'focus':''} ${p.id===selected?'sel':''}`,
                 transform:`translate(${x},${y})`,'data-id':p.id},g);
  S('rect',{width:CW,height:CH,rx:10},a);
  S('rect',{class:'bar',width:7,height:CH,rx:3},a);
  S('circle',{cx:36,cy:CH/2,r:20,class:'av'},a);
  S('circle',{cx:36,cy:CH/2-5,r:6.5,class:'sil'},a);
  S('path',{d:`M23 ${CH/2+15} q13 -22 26 0z`,class:'sil'},a);
  if(p.photo) S('image',{href:photoUrl(p),x:16,y:CH/2-20,width:40,height:40,preserveAspectRatio:'xMidYMid slice','clip-path':'url(#avclip)'},a);
  S('circle',{cx:36,cy:CH/2,r:20,class:'ring'},a);
  S('text',{x:64,y:28,class:'nm'},a).textContent=trunc(p.name,17);
  S('text',{x:64,y:47,class:'yr'},a).textContent=years(p);
  S('title',{},a).textContent=p.name;
  a.addEventListener('click',e=>{e.stopPropagation(); if(moved)return; select(p.id)});
  a.addEventListener('dblclick',e=>{e.stopPropagation();setFocus(p.id)});
}
function placeholder(g,x,y,childId){
  const a=S('g',{class:'ph',transform:`translate(${x},${y})`},g);
  S('rect',{width:CW,height:CH,rx:10},a);
  const t=S('text',{x:CW/2,y:CH/2+5,'text-anchor':'middle'},a); t.textContent='+ Add parent';
  a.addEventListener('click',async e=>{e.stopPropagation(); if(moved)return; await select(childId);openForm('parent');});
}
const edge=(g,d,cls='edge')=>S('path',{d,class:cls},g);

/* ---------- pedigree (ancestors, left → right) ---------- */
function slots(n){
  const ps=n.parents; if(ps.length>=2) return ps.slice(0,2);
  const ph=()=>({placeholder:true,child:n.person.id,parents:[]});
  if(!ps.length) return [ph(),ph()];
  return ps[0].person.gender==='F'?[ph(),ps[0]]:[ps[0],ph()];
}
function layoutPed(n,gen,ctx){
  const kids=(!n.placeholder&&gen<depth)?slots(n).map(k=>layoutPed(k,gen+1,ctx)):[];
  n.y=kids.length?(kids[0].y+kids[kids.length-1].y)/2:ctx.next++*(CH+VGAP);
  n.x=gen*(CW+COLGAP); ctx.nodes.push(n); kids.forEach(k=>ctx.edges.push([n,k])); return n;
}
function drawPedigree(t,eg,cg){
  const ctx={next:0,nodes:[],edges:[]}; layoutPed(t,0,ctx);
  ctx.edges.forEach(([a,b])=>{const x1=a.x+CW,y1=a.y+CH/2,x2=b.x,y2=b.y+CH/2,mx=x1+COLGAP/2;
    edge(eg,`M${x1} ${y1}H${mx}V${y2}H${x2}`)});
  ctx.nodes.forEach(n=>n.placeholder?placeholder(cg,n.x,n.y,n.child):card(cg,n.person,n.x,n.y));
}

/* ---------- descendants (top → bottom, couples side by side) ---------- */
function measure(n){
  const c=1+n.spouses.length; n.unitW=c*CW+(c-1)*SG; n.children.forEach(measure);
  const kw=n.children.reduce((s,k)=>s+k.w,0)+HG*Math.max(0,n.children.length-1);
  n.kw=kw; n.w=Math.max(n.unitW,kw);
}
function place(n,x0,gen,out){
  n.y=gen*(CH+VG); n.left=x0+(n.w-n.unitW)/2; out.push(n);
  let x=x0+(n.w-n.kw)/2; n.children.forEach(k=>{place(k,x,gen+1,out); x+=k.w+HG;});
}
function drawDescendants(t,eg,cg){
  measure(t); const nodes=[]; place(t,0,0,nodes);
  nodes.forEach(n=>{
    const people=[n.person,...n.spouses.map(s=>s.person)];
    people.forEach((p,i)=>card(cg,p,n.left+i*(CW+SG),n.y));
    n.spouses.forEach((s,i)=>{const x=n.left+(i+1)*CW+i*SG; // marriage bar in gap
      edge(eg,`M${x} ${n.y+CH/2}H${x+SG}`,'edge marry');});
    n.ax=n.spouses.length?n.left+CW+SG/2:n.left+CW/2;
    n.ay=n.spouses.length?n.y+CH/2:n.y+CH;
    n.children.forEach(k=>{const kx=k.left+CW/2,ky=k.y,my=n.y+CH+VG/2;
      edge(eg,`M${n.ax} ${n.ay}V${my}H${kx}V${ky}`);});
  });
}

/* ---------- render / view ---------- */
async function render(fit=true){
  vp.innerHTML=''; if(!focus) return;
  const eg=S('g',{},vp), cg=S('g',{},vp);
  try{
    if(view==='pedigree') drawPedigree(await api(`/api/tree/pedigree/${focus}?depth=${depth}`),eg,cg);
    else drawDescendants(await api(`/api/tree/descendants/${focus}?depth=${depth}`),eg,cg);
  }catch(e){toast(e.message);}
  $('#focusname').textContent='Tree of '+(byId(focus)?.name||'');
  location.hash=`${view}/${focus}`;
  if(fit) fitView();
}
function applyT(){vp.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`);}
function fitView(){
  const b=vp.getBBox(), r=svg.getBoundingClientRect(); if(!b.width) return;
  const pad=40, k=Math.min(1.1,(r.width-pad*2)/b.width,(r.height-pad*2)/b.height);
  T.k=k; T.x=(r.width-b.width*k)/2-b.x*k; T.y=(r.height-b.height*k)/2-b.y*k; applyT();
  if(k<.5&&r.width<800){                       // a big tree on a small screen: stay readable, start at the focus person
    T.k=.6; applyT(); const c=svg.querySelector('.card.focus')||svg.querySelector('.card');
    if(c){const q=c.getBoundingClientRect(); T.x+=r.left+r.width/2-(q.left+q.width/2); T.y+=r.top+r.height/2-(q.top+q.height/2); applyT();}
  }
}
async function setFocus(id){focus=id; await render(); await select(id,true);}
function setView(v){view=v;$('#v-ped').classList.toggle('on',v==='pedigree');
  $('#v-desc').classList.toggle('on',v==='descendants'); depth=v==='pedigree'?+$('#depth').value:+$('#depth').value; render();}

/* ---------- pan & zoom ---------- */
let drag=null, moved=false, pinch=null; const ptrs=new Map();
const rel=e=>{const r=svg.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};};
function startDrag(pt){drag={x:pt.x,y:pt.y,tx:T.x,ty:T.y};}
function startPinch(){const [a,b]=[...ptrs.values()];
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx:T.x,ty:T.y,k:T.k};}
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,rel(e));
  if(ptrs.size===1){moved=false;startDrag(ptrs.get(e.pointerId));}
  else if(ptrs.size===2){drag=null;moved=true;startPinch();}});
addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return; const pt=rel(e); ptrs.set(e.pointerId,pt);
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const k2=Math.min(3,Math.max(.15,pinch.k*d/pinch.d)), wx=(pinch.cx-pinch.tx)/pinch.k, wy=(pinch.cy-pinch.ty)/pinch.k;
    T.k=k2;T.x=cx-wx*k2;T.y=cy-wy*k2;applyT();return;}
  if(!drag)return; const dx=pt.x-drag.x,dy=pt.y-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>(e.pointerType==='touch'?10:3))moved=true;
  if(moved){T.x=drag.tx+dx;T.y=drag.ty+dy;applyT();}});
const endPtr=e=>{ptrs.delete(e.pointerId); pinch=null; drag=null;
  if(ptrs.size===1){startDrag([...ptrs.values()][0]);}};      // one finger left after a pinch: keep panning
addEventListener('pointerup',endPtr); addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const k2=Math.min(3,Math.max(.15,T.k*(e.deltaY<0?1.1:.9)));
  T.x=mx-(mx-T.x)*k2/T.k;T.y=my-(my-T.y)*k2/T.k;T.k=k2;applyT();},{passive:false});
svg.addEventListener('click',()=>{if(moved)return; closePanel();});

function confirmDelete(p){
  const nLinks=p.parents.length+p.children.length, nMar=p.spouses.length;
  const bits=[]; if(nLinks) bits.push(`${nLinks} parent/child link${nLinks>1?'s':''}`);
  if(nMar) bits.push(`${nMar} marriage${nMar>1?'s':''}`); if(p.photo) bits.push('their photo');
  $('#delbox').innerHTML=`<div class="warn"><p><b>Delete ${esc(p.name)}?</b>${bits.length?` This also removes ${bits.join(', ')}.`:''}
    The people they were linked to stay in the tree. This can't be undone.</p>
    <div class="row"><button class="btn danger solid" id="yesdel">Yes, delete</button><button class="btn ghost" id="nodel">Cancel</button></div></div>`;
  $('#nodel').onclick=()=>$('#delbox').innerHTML='';
  $('#yesdel').onclick=async()=>{
    $('#yesdel').disabled=true;
    try{
      await api(`/api/person/${p.id}/delete`,{});
      await loadPeople(); closePanel();
      if(!people.length){focus=null; vp.innerHTML=''; $('#focusname').textContent=''; location.hash=''; firstPerson(); return;}
      if(focus===p.id){const next=[...p.parents,...p.spouses,...p.children,...p.siblings].find(x=>byId(x.id)); focus=next?next.id:people[0].id;}
      await render(false); toast(`${p.name} was deleted`,true);
    }catch(e){toast(e.message); $('#yesdel').disabled=false;}
  };
}

/* ---------- photos ---------- */
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that image. Try a JPG or PNG.'));}; im.src=u;});}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function shrink(file){   // centre-crop to a square, then lower size/quality until it fits the limit
  const im=await loadImage(file), w=im.naturalWidth, h=im.naturalHeight, m=Math.min(w,h);
  let S=Math.min(400,m);
  while(S>=80){
    const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,S,S); x.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,S,S);
    for(const q of [.85,.75,.65,.55,.45]){const b=await toBlob(c,q); if(b&&b.size<=MAXPHOTO) return b;}
    S=Math.floor(S*.8);
  }
  throw new Error('Could not shrink that photo enough');
}

      if(r.status===401){location.replace('/login');return;}
      const j=await r.json(); if(!r.ok) throw new Error(j.error||'Upload failed');

    }catch(e){toast(e.message);}};
  inp.click();
}

/* ---------- Time Capsule (photo carousel from Google Drive) ---------- */
let treeInit=false;

const capUrl=(p,thumb)=>`/api/capsule/photo/${p.id}?v=${encodeURIComponent(p.version)}${thumb?'&size=thumb':''}`;
const capMsg=h=>{$('#cap-msg').innerHTML=h;$('#cap-msg').style.display='';$('#cap-wrap').hidden=true;};
async function capLoad(refresh,opts={}){
  if(!opts.quiet){capMsg('Loading photos…'); capStop();}
  try{
    const d=await api('/api/capsule'+(refresh?'?refresh=1':''));
    cap.canEdit=!!d.canEdit; $('#cap-actions').hidden=!d.configured; $('#cap-add').hidden=!d.canEdit;
    if(!d.configured) return capMsg('<h2>Time Capsule</h2>To show photos here, put them in a Google Drive folder, share that folder (Viewer) with your service account, and set <code>DRIVE_FOLDER_ID</code> on the server to the folder\'s id or link.');
    $('#cap-note').hidden=!d.photos.length; $('#cap-edit').hidden=$('#cap-del').hidden=!d.photos.length||!d.canEdit;
    if(!d.photos.length){
      cap.photos=[];
      let why = d.seen===0 ? 'The app can open the folder, but it contains no files.'+(d.canEdit?' Use <b>+ Add photos</b> above to put the first ones in.':' If your photos are somewhere else, move them into the shared folder (subfolders are fine), or share the folder that really holds them.')
        : `The app can open the folder and sees ${d.seen} file${d.seen>1?'s':''}, but none are photos it can show (JPEG, PNG, WebP or GIF).`;
      if(d.skipped) why+=` ${d.skipped} image file${d.skipped>1?'s were':' was'} skipped, for example HEIC, which browsers cannot show.`;
      if(d.other&&d.other.length) why+=`<br><br>Files seen: ${d.other.map(esc).join(', ')}`;

    }

  }catch(e){const m=e.message||'';
    capMsg('<h2>Time Capsule</h2>'+esc(m)+(m==='not found'?'<br><br>The server is running an older version of the app that has no Time Capsule. Deploy <code>drive_photos.py</code> and the latest <code>web.py</code>, then reload.':''));}
}

/* ---- add, edit and delete photos ---- */
const CAPMAX=10*1024*1024, capStatus=t=>{$('#cap-status').textContent=t||'';};
async function prepPhoto(file){       // send the original when we can (it keeps the date taken); redraw HEIC/huge ones as JPEG
  if((/^image\/(jpeg|png|webp|gif)$/.test(file.type)||/\.(jpe?g|png|webp|gif)$/i.test(file.name))&&file.size<=CAPMAX) return file;
  let im; try{im=await loadImage(file);}catch(e){throw new Error(`${file.name}: this browser cannot read that picture type (iPhone HEIC photos usually need to be shared as JPEG, or choose "Most compatible" in the camera settings)`);}
  let S=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));
  for(let t=0;t<5;t++){
    const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*S); c.height=Math.round(im.naturalHeight*S);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    const b=await toBlob(c,.88); if(b&&b.size<=CAPMAX) return b; S*=.75;
  }
  throw new Error(`${file.name}: could not make it small enough`);
}
function capAsk(title,body,okLabel,danger){
  return new Promise(res=>{
    const d=$('#cap-dialog');
    d.innerHTML=`<div class="cap-box" role="dialog"><h3>${title}</h3>${body}<div class="row"><button class="btn ${danger?'danger solid':''}" id="cd-ok">${okLabel}</button><button class="btn ghost" id="cd-no">Cancel</button></div></div>`;
    d.hidden=false;
    const done=ok=>{const v=ok?Object.fromEntries([...d.querySelectorAll('input,textarea')].map(i=>[i.id,i.value])):null; d.hidden=true; d.innerHTML=''; res(v);};
    $('#cd-ok').onclick=()=>done(true); $('#cd-no').onclick=()=>done(false); d.onclick=e=>{if(e.target===d)done(false);};
    d.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')done(true); else if(e.key==='Escape')done(false);});
    const f=d.querySelector('input:not([type=hidden]),textarea'); if(f) f.focus(); else $('#cd-no').focus();
  });
}

/* ---- description and people for a photo (kept in the Sheet, so no Drive write access is needed) ---- */
$('#cap-note').onclick=async()=>{
  const p=cap.photos[cap.i]; if(!p) return; capStop();
  if(!people.length) await loadPeople().catch(()=>{});
  let sel=(p.people||[]).map(x=>x.id);
  const pr=capAsk('Describe this photo',`<label for="cn-desc">Short description</label>
    <textarea id="cn-desc" rows="4" maxlength="600" placeholder="Who, where, what was happening…">${esc(p.about||'')}</textarea>
    <label for="cn-add">People in this photo</label><div class="cchips" id="cn-chips"></div>
    <input id="cn-add" list="plist" placeholder="Type a name to add…" autocomplete="off"><input type="hidden" id="cn-people">`,'Save');
  const chips=()=>{ $('#cn-people').value=sel.join(',');
    $('#cn-chips').innerHTML=''; sel.forEach(id=>{const x=byId(id); if(!x) return; const b=document.createElement('button'); b.type='button';
      b.innerHTML=esc(x.name)+'<span class="x">&times;</span>'; b.title='Remove'; b.onclick=()=>{sel=sel.filter(i=>i!==id); chips();}; $('#cn-chips').appendChild(b);}); };
  const toId=v=>{v=(v||'').trim(); return (v.match(/\[(\w+)\]\s*$/)||[])[1]||(people.find(x=>x.name.toLowerCase()===v.toLowerCase())||{}).id;};
  const add=()=>{ const el=$('#cn-add'), id=toId(el.value); if(id&&byId(id)&&!sel.includes(id)){sel.push(id); chips();} el.value=''; };
  chips(); $('#cn-add').onchange=add; $('#cn-add').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); add();} else if(e.key==='Escape'){$('#cd-no').click();} };
  const v=await pr; if(!v) return;
  try{
    const ids=v['cn-people']?v['cn-people'].split(','):[]; const last=toId(v['cn-add']); if(last&&byId(last)&&!ids.includes(last)) ids.push(last);   // a name typed but not yet confirmed
    const j=await api('/api/capsule/note/'+encodeURIComponent(p.id),{description:v['cn-desc'],people:ids});
    p.about=j.about; p.people=j.people; capShow(cap.i); toast('Saved',true);
  }catch(e){toast(e.message);}
};
$('#cap-add').onclick=()=>$('#cap-file').click();
$('#cap-file').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  capStop(); const fails=[]; let lastId=null, ok=0;
  $('#cap-add').disabled=true;
  for(let k=0;k<files.length;k++){
    const f=files[k]; capStatus(`Uploading ${k+1} of ${files.length}…`);
    try{
      const blob=await prepPhoto(f);
      const q=new URLSearchParams({name:f.name,modified:new Date(f.lastModified||Date.now()).toISOString().replace(/\.\d+Z$/,'Z')});
      const r=await fetch('/api/capsule/photo?'+q,{method:'POST',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});
      if(r.status===401){location.replace('/login');return;}
      let j={}; try{j=await r.json();}catch(_){}
      if(!r.ok) throw new Error(j.error||('Upload failed ('+r.status+')'));
      lastId=j.id; ok++;
    }catch(err){fails.push(err.message); if(/storage space|sign-in|not allowed|switched off/i.test(err.message)) break;}
  }
  $('#cap-add').disabled=false; capStatus('');
  if(ok) await capLoad(false,{quiet:true,id:lastId});
  if(fails.length) toast((ok?`${ok} added. `:'')+fails[0]+(fails.length>1?` (+${fails.length-1} more problems)`:''),false,10000);
  else toast(`${ok} photo${ok>1?'s':''} added`,true);
};
$('#cap-edit').onclick=async()=>{
  const p=cap.photos[cap.i]; if(!p) return;
  const v=await capAsk('Edit photo details',`<label for="ce-cap">Caption</label><input id="ce-cap" maxlength="500" value="${esc(p.caption)}">
    <label for="ce-date">Date (shown under the caption and used for the order)</label><input id="ce-date" type="date" value="${esc(p.date||'')}">`,'Save');
  if(!v) return;
  const body={}; if(v['ce-cap'].trim()!==p.caption) body.caption=v['ce-cap']; if(v['ce-date']!==(p.date||'')) body.date=v['ce-date'];
  if(!Object.keys(body).length) return;
  try{capStatus('Saving…'); await api('/api/capsule/photo/'+p.id,body); capStatus(''); await capLoad(false,{quiet:true,id:p.id}); toast('Saved',true);}
  catch(err){capStatus(''); toast(err.message,false,8000);}
};
$('#cap-del').onclick=async()=>{
  const p=cap.photos[cap.i]; if(!p) return;
  const v=await capAsk('Delete this photo?',`<p><b>${esc(p.caption)}</b><br>It moves to the Google Drive trash, where it stays for 30 days before it is gone for good.</p>`,'Delete photo',true);
  if(!v) return;
  try{capStatus('Deleting…'); await api(`/api/capsule/photo/${p.id}/delete`,{}); capStatus(''); await capLoad(false,{quiet:true,index:cap.i}); toast('Photo deleted',true);}
  catch(err){capStatus(''); toast(err.message,false,8000);}
};
let treeP=null;
function setTab(t){
  const c=t==='capsule', k=t==='ask'; document.body.classList.toggle('cap',c); document.body.classList.toggle('ask',k);
  $('#t-tree').classList.toggle('on',!c&&!k); $('#t-cap').classList.toggle('on',c); $('#t-ask').classList.toggle('on',k);
  if(!c) capStop();
  if(c){ location.hash='capsule'; if(!cap.loaded) capLoad(); }
  else if(k){ location.hash='ask'; chatInit(); }
  else{ if(!treeInit) treeP=initTree(); else location.hash=focus?`${view}/${focus}`:''; }
}
$('#t-tree').onclick=()=>setTab('tree'); $('#t-cap').onclick=()=>setTab('capsule'); $('#t-ask').onclick=()=>setTab('ask');
$('#cap-prev').onclick=()=>{capShow(cap.i-1)}; $('#cap-next').onclick=()=>{capShow(cap.i+1)};
$('#cap-play').onclick=capToggle;
$('#cap-full').onclick=()=>{const st=$('#cap-stage'); document.fullscreenElement?document.exitFullscreen():st.requestFullscreen&&st.requestFullscreen();};
document.addEventListener('keydown',e=>{ const tg=e.target.tagName; if(!document.body.classList.contains('cap')||!$('#cap-dialog').hidden||/INPUT|TEXTAREA|SELECT/.test(tg)||(tg==='BUTTON'&&e.key===' ')) return;
  if(e.key==='ArrowLeft') capShow(cap.i-1); else if(e.key==='ArrowRight') capShow(cap.i+1);
  else if(e.key===' '){e.preventDefault();capToggle();} });
(()=>{let x=null; const st=$('#cap-stage');
  st.addEventListener('touchstart',e=>{x=e.touches[0].clientX;},{passive:true});
  st.addEventListener('touchend',e=>{ if(x===null) return; const d=e.changedTouches[0].clientX-x; x=null; if(Math.abs(d)>40) capShow(cap.i+(d<0?1:-1)); });})();


/* ---------- Ask: chat assistant over the family data ---------- */
const chat={ready:false,configured:false,msgs:[],busy:false};
const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function mdLite(t){
  let html='',list=false;
  for(const ln of esc(t).split('\n')){
    const m=ln.match(/^\s*(?:[-*\u2022]|\d+[.)])\s+(.*)$/);
    if(m){ if(!list){html+='<ul>';list=true;} html+='<li>'+inl(m[1])+'</li>'; }
    else{ if(list){html+='</ul>';list=false;} if(ln.trim()) html+='<p>'+inl(ln)+'</p>'; }
  }
  return html+(list?'</ul>':'');
}
function chatAdd(cls,html){const d=document.createElement('div'); d.className='cmsg '+cls; d.innerHTML=html; const l=$('#chat-log'); l.appendChild(d); l.scrollTop=l.scrollHeight; return d;}
async function chatInit(){
  if(chat.ready){$('#chat-in').focus();return;}
  chat.ready=true; $('#chat-log').innerHTML='';
  try{
    const st=await api('/api/chat'); chat.configured=st.configured;
    if(!st.configured){
      $('#chat-bar').style.display='none';
      return chatAdd('hello','<h2>Ask about your family</h2>The assistant is not switched on yet. On the server, set <code>ANTHROPIC_API_KEY</code> (an Anthropic API key) and redeploy.');
    }
    chatAdd('hello','<h2>Ask about your family</h2>Ask in plain words, for example how two people are related, who has a certain nakshatra or gotra, or who was born in a given period. Answers come only from your tree'+(st.health?'':' (health notes are hidden from the assistant)')+'.');
    if(!people.length) await loadPeople().catch(()=>{});     // opened straight on this tab
    chatSuggest();
  }catch(e){chat.ready=false; chatAdd('err',esc(e.message));}
  $('#chat-in').focus();
}
function chatSuggest(){
  const P=people, q=[]; if(!P.length){$('#chat-sugg').innerHTML='';return;}
  q.push('Give me a short summary of the family');
  if(P.length>1){const a=P[Math.min(1,P.length-1)],b=P[P.length-1]; if(a.id!==b.id) q.push(`How are ${a.name} and ${b.name} related?`);}
  const g=(P.find(p=>p.gotra)||{}).gotra, n=(P.find(p=>p.nakshatra)||{}).nakshatra;
  if(g) q.push(`Who belongs to the ${g} gotra?`); if(n) q.push(`Who has the ${n} nakshatra?`);
  if(!g&&!n) q.push(`Who are ${P[0].name}'s descendants?`);
  const box=$('#chat-sugg'); box.innerHTML='';
  q.slice(0,4).forEach(t=>{const b=document.createElement('button'); b.textContent=t; b.onclick=()=>chatSend(t); box.appendChild(b);});
}
async function chatOpen(id){ setTab('tree'); if(treeP) await treeP; await setFocus(id); }
async function chatSend(text){
  text=(text||$('#chat-in').value).trim(); if(!text||chat.busy) return;
  chat.busy=true; $('#chat-in').value=''; $('#chat-in').style.height=''; $('#chat-sugg').innerHTML='';
  $('#chat-send').disabled=$('#chat-in').disabled=true;
  chatAdd('u',esc(text)); chat.msgs.push({role:'user',content:text});
  const wait=chatAdd('a','<span class="dots"><span></span><span></span><span></span></span>');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.msgs.slice(-12)})});
    if(r.status===401){location.replace('/login');return;}
    let j={}; try{j=await r.json();}catch(_){}
    if(!r.ok) throw new Error(j.error||('Something went wrong ('+r.status+')'));
    wait.innerHTML=mdLite(j.answer); chat.msgs.push({role:'assistant',content:j.answer});
    if((j.people||[]).length){
      const row=document.createElement('div'); row.className='cchips'; row.innerHTML='<span class="lbl">Open in tree:</span>';
      j.people.forEach(p=>{const b=document.createElement('button'); b.textContent=p.name; b.onclick=()=>chatOpen(p.id); row.appendChild(b);});
      wait.appendChild(row);
    }
  }catch(e){ wait.className='cmsg err'; wait.textContent=e.message; chat.msgs.pop(); }
  finally{ chat.busy=false; $('#chat-send').disabled=$('#chat-in').disabled=false; $('#chat-in').focus(); const l=$('#chat-log'); l.scrollTop=l.scrollHeight; }
}
$('#chat-send').onclick=()=>chatSend();
$('#chat-in').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend();} });
$('#chat-in').addEventListener('input',e=>{const t=e.target; t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px';});

/* ---------- boot ---------- */
function firstPerson(){
  const el=$('#panel'); el.classList.add('open'); el._p=null;
  el.innerHTML=`<h2>Start your tree</h2><div class="sub">No one is here yet. Add the first person.</div>
    <form id="f"><input name="name" placeholder="Full name" required>
    <select name="gender"><option value="">Gender</option><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select>
    <input name="birth" placeholder="Birth (e.g. 1950)"><input name="death" placeholder="Death (optional)">
    ${extraFields()}
    <button class="btn" type="submit">Create</button></form>`;
  $('#f').onsubmit=async e=>{e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
    try{const p=await api('/api/person',f); await loadPeople(); focus=p.id; closePanel(); await render();}catch(err){toast(err.message);}};
}
function fillLists(){
  const known=k=>[...new Set(people.map(p=>p[k]).filter(Boolean))];
  const opts=(base,k)=>[...new Set([...base,...known(k)])].map(v=>`<option value="${esc(v)}">`).join('');
  $('#nakl').innerHTML=opts(NAKSHATRAS,'nakshatra'); $('#gotl').innerHTML=opts(GOTRAS,'gotra');
}
async function loadPeople(){
  people=await api('/api/people');
  $('#plist').innerHTML=people.map(p=>`<option value="${esc(p.name)} [${p.id}]">`).join(''); fillLists();
}
$('#search').addEventListener('change',e=>{const id=(e.target.value.match(/\[(\w+)\]\s*$/)||[])[1]
  ||people.find(p=>p.name.toLowerCase()===e.target.value.trim().toLowerCase())?.id;
  if(id){setFocus(id);e.target.value='';}});
$('#v-ped').onclick=()=>setView('pedigree'); $('#v-desc').onclick=()=>setView('descendants');
const narrow=matchMedia('(max-width:800px)').matches;
$('#depth').innerHTML=[2,3,4,5,6,8].map(n=>`<option value="${n}" ${n===4?'selected':''}>${narrow?n+' gen':n+' generations'}</option>`).join('');
$('#depth').onchange=e=>{depth=+e.target.value;render();};
(()=>{const sh=$('#sheet'),pn=$('#panel');
  new MutationObserver(()=>sh.classList.toggle('open',pn.classList.contains('open'))).observe(pn,{attributes:true,attributeFilter:['class']});
  $('#pclose').onclick=closePanel;})();
$('#hinttxt').textContent=matchMedia('(pointer:coarse)').matches
  ? 'Drag to pan · pinch to zoom · tap a card for details'
  : 'Drag to pan · scroll to zoom · click a card for details · double-click to re-center the tree';
if(!document.documentElement.requestFullscreen) $('#cap-full').style.display='none';
$('#fit').onclick=fitView; addEventListener('resize',()=>fitView());
$('#panel').addEventListener('click',e=>e.stopPropagation());
(async()=>{
  try{const s=await api('/api/status'); if(s.max_photo_bytes) MAXPHOTO=Math.min(s.max_photo_bytes,250000); $('#src').textContent=s.source==='google-sheet'?'Data: Google Sheet':'Data: text file (not Google Sheet)';
    if(s.auth){const b=$('#logout'); b.style.display=''; b.title='Signed in as '+s.user;
      b.onclick=async()=>{await fetch('/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); location.replace('/login');};}}catch(e){}
  await loadPeople();
  if(location.hash==='#capsule') return setTab('capsule');      // opened straight on the Time Capsule tab
  if(location.hash==='#ask') return setTab('ask');
  await initTree();
})();
async function initTree(){
  treeInit=true;
  if(!people.length) return firstPerson();
  const [v,id]=location.hash.slice(1).split('/');
  if(v==='descendants'){view='descendants';$('#v-ped').classList.remove('on');$('#v-desc').classList.add('on');}
  focus=byId(id)?id:people[0].id; depth=+$('#depth').value; await render();
}
</script>
